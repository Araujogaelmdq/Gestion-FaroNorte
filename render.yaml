services:
  - type: web
    name: faronorte-gestion
    runtime: node
    plan: free
    buildCommand: npm install --production=false && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        value: sqlite.db

